<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sender Dashboard</title>
    <script src="qrcode.min.js"></script>
    <style>
        :root {
            --bg: #0f172a; --surface: #1e293b; --primary: #3b82f6; 
            --text: #f8fafc; --text-muted: #94a3b8; 
            --success: #10b981; --error: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--text); padding: 24px;
            display: flex; flex-direction: column; gap: 20px;
        }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .card { background: var(--surface); border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .status-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: 500; background: rgba(255,255,255,0.1); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
        .btn { display: flex; justify-content: center; align-items: center; width: 100%; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; border: none; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--surface); color: var(--error); border: 1px solid var(--error); }
        .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--text-muted); }
        .info-value { font-weight: 600; text-align: right; word-break: break-all; }
        .qr-section { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 16px; margin-top: 10px; }
        .qr-box { display: flex; flex-direction: column; align-items: center; gap: 8px; background: #fff; padding: 12px; border-radius: 12px; }
        .qr-label { color: #333; font-weight: 600; font-size: 14px; }
        input[type="text"] { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; font-size: 16px; margin-bottom: 12px;}
        input:focus { outline: 2px solid var(--primary); }
        .poll-section { opacity: 0.5; pointer-events: none; }
        .poll-fields { display: none; margin-top: 15px; flex-direction: column; gap: 10px; }
    
        .messages { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .msg-bubble { background: var(--surface); padding: 16px; border-radius: 12px; font-size: 16px; border-left: 4px solid var(--primary); animation: slideIn 0.3s ease-out; }
        .msg-time { font-size: 12px; color: var(--text-muted); margin-top: 8px; text-align: right; }
        .poll-card { border-left: 4px solid #f59e0b; }
        .poll-q { font-weight: bold; margin-bottom: 12px; font-size: 18px; }
        .poll-opt {
            background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); 
            padding: 12px; border-radius: 8px; margin-bottom: 8px;
            position: relative; overflow: hidden;
        }
        .poll-bar {
            position: absolute; left: 0; top: 0; bottom: 0;
            background: rgba(59,130,246,0.3); width: 0%;
            transition: width 0.5s ease; z-index: 0;
        }
        .poll-text { position: relative; z-index: 1; display: flex; justify-content: space-between; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
    <div>
        <h1>Broadcast Hub</h1>
        <div class="status-badge" id="statusBadge"><div class="status-dot" id="statusDot"></div><span id="statusText">Idle</span></div>
    </div>

    <div class="card" id="controlsCard">
        <button class="btn btn-primary" id="startBtn" onclick="start()">Start Hotspot & Server</button>
        <button class="btn btn-danger" id="stopBtn" onclick="stop()" style="display: none; margin-top: 10px;">Stop</button>
    </div>

    <div class="card" id="networkCard" style="display: none;">
        <div class="info-row"><span class="info-label">SSID</span><span class="info-value" id="valSsid">-</span></div>
        <div class="info-row"><span class="info-label">Password</span><span class="info-value" id="valPass">-</span></div>
        <div class="info-row"><span class="info-label">Receivers</span><span class="info-value" id="valClients">0</span></div>
        <div class="qr-section">
            <div class="qr-box"><span class="qr-label">1. Join Wi-Fi</span><div id="qrWifi"></div></div>
            <div class="qr-box" id="qrUrlBox" style="display: none;"><span class="qr-label">2. Open Link</span><div id="qrUrl"></div></div>
        </div>
    </div>

    <div class="card broadcast-section" id="broadcastCard" style="opacity: 0.5; pointer-events: none;">
        <h3 style="font-size: 16px; color: var(--text-muted); margin-bottom: 10px;">Send Message</h3>
        <input type="text" id="msgInput" placeholder="Type a message..." />
        <button class="btn btn-primary" onclick="sendMsg()">Broadcast Message</button>
    </div>

    <!-- Toggleable Poll Section -->
    <div class="card poll-section" id="pollCard">
        <button class="btn btn-outline" id="togglePollBtn" onclick="togglePoll()">Create a Live Poll 📊</button>
        <div class="poll-fields" id="pollFields">
            <input type="text" id="pollQ" placeholder="Question (e.g. Favorite JS Framework?)" />
            <input type="text" id="pollOpts" placeholder="Options (comma separated)" />
            <button class="btn btn-primary" onclick="sendPoll()">Push Poll</button>
        </div>
    </div>

    
    <div class="card" id="feedCard" style="display: none;">
        <h3 style="font-size: 16px; color: var(--text-muted); margin-bottom: 10px;">Live Audience Feed</h3>
        <div class="messages" id="msgs"></div>
    </div>

    <script>
        const $ = id => document.getElementById(id);

        const activePolls = {};
        window.onReceiveEvent = (jsonStr) => {
            try {
                const data = JSON.parse(jsonStr);
                appendItem(data);
            } catch(e) {}
        };
        
        function appendItem(data) {
            const msgs = document.getElementById("msgs");
            if (!msgs) return false;
            
            if (data.type === "poll_update") {
                updatePoll(data.id, data.votes);
                return false;
            }
            if (document.getElementById(data.id)) return false;
            
            const div = document.createElement("div");
            div.className = "msg-bubble " + (data.type === "poll" ? "poll-card" : "");
            div.id = data.id;
            
            if (data.type === "message") {
                const txt = document.createElement("div"); txt.textContent = data.text;
                div.appendChild(txt);
            } else if (data.type === "poll") {
                const q = document.createElement("div"); q.className = "poll-q"; q.textContent = "📊 " + data.question;
                div.appendChild(q);
                
                activePolls[data.id] = [];
                let totalVotes = data.votes.reduce((a, b) => a + b, 0);
                
                data.options.forEach((optStr, idx) => {
                    const optDiv = document.createElement("div");
                    optDiv.className = "poll-opt";
                    
                    const bar = document.createElement("div");
                    bar.className = "poll-bar";
                    const pct = totalVotes > 0 ? Math.round((data.votes[idx] / totalVotes) * 100) : 0;
                    bar.style.width = pct + "%";
                    
                    const textWrap = document.createElement("div");
                    textWrap.className = "poll-text";
                    const spanL = document.createElement("span"); spanL.textContent = optStr;
                    const spanR = document.createElement("span"); spanR.textContent = pct + "%";
                    textWrap.appendChild(spanL); textWrap.appendChild(spanR);
                    
                    optDiv.appendChild(bar);
                    optDiv.appendChild(textWrap);
                    
                    activePolls[data.id].push({ bar, spanR });
                    div.appendChild(optDiv);
                });
            }
            
            const time = document.createElement("div"); time.className = "msg-time";
            time.textContent = new Date(data.ts).toLocaleTimeString();
            div.appendChild(time);
            
            msgs.prepend(div);
            return true;
        }
        
        function updatePoll(id, votes) {
            const p = activePolls[id];
            if (!p) return;
            const total = votes.reduce((a, b) => a + b, 0);
            if (total === 0) return;
            
            votes.forEach((v, idx) => {
                const pct = Math.round((v / total) * 100);
                p[idx].bar.style.width = pct + "%";
                p[idx].spanR.textContent = pct + "%";
            });
        }

        let wifiQrObj = null, urlQrObj = null;
        
        window.updateStatus = (status) => $("statusText").textContent = status;
        window.showError = (err) => {
            $("statusText").textContent = "Error: " + err;
            $("statusDot").style.background = "var(--error)";
            $("startBtn").style.display = "block";
            $("stopBtn").style.display = "none";
        };
        window.updateClientCount = (count) => $("valClients").textContent = count;
        
        window.onHotspotActive = (ssid, pass, ips) => {
            $("statusText").textContent = "Active & Broadcasting";
            $("statusDot").style.background = "var(--success)";
            $("startBtn").style.display = "none";
            $("stopBtn").style.display = "block";
            $("networkCard").style.display = "block";
            $("feedCard").style.display = "block";
            $("valSsid").textContent = ssid;
            $("valPass").textContent = pass;
            
            const wifiString = `WIFI:T:WPA;S:${ssid};P:${pass};;`;
            if (wifiQrObj) wifiQrObj.makeCode(wifiString);
            else wifiQrObj = new QRCode($("qrWifi"), { text: wifiString, width: 128, height: 128 });
            
            if (ips && ips.length > 0) {
                $("qrUrlBox").style.display = "flex";
                const urlString = `http://${ips[0]}:8080/`;
                if (urlQrObj) urlQrObj.makeCode(urlString);
                else urlQrObj = new QRCode($("qrUrl"), { text: urlString, width: 128, height: 128 });
            } else $("qrUrlBox").style.display = "none";
            
            $("broadcastCard").style.opacity = "1";
            $("broadcastCard").style.pointerEvents = "auto";
            $("pollCard").style.opacity = "1";
            $("pollCard").style.pointerEvents = "auto";
        };
        
        window.onHotspotStopped = () => {
            $("statusText").textContent = "Idle";
            $("statusDot").style.background = "#ccc";
            $("startBtn").style.display = "block";
            $("stopBtn").style.display = "none";
            $("networkCard").style.display = "none";
            $("feedCard").style.display = "none";
            $("msgs").innerHTML = "";
            $("valClients").textContent = "0";
            $("broadcastCard").style.opacity = "0.5";
            $("broadcastCard").style.pointerEvents = "none";
            $("pollCard").style.opacity = "0.5";
            $("pollCard").style.pointerEvents = "none";
            $("pollFields").style.display = "none";
        };
        
        function start() { $("statusText").textContent = "Requesting permissions..."; if(window.AndroidBridge) window.AndroidBridge.startHotspot(); }
        function stop() { if(window.AndroidBridge) window.AndroidBridge.stopHotspot(); }
        function sendMsg() {
            const input = $("msgInput");
            if(!input.value.trim()) return;
            if(window.AndroidBridge) { window.AndroidBridge.broadcast(input.value); input.value = ""; }
        }
        
        function togglePoll() {
            const fields = $("pollFields");
            if (fields.style.display === "flex") {
                fields.style.display = "none";
            } else {
                fields.style.display = "flex";
            }
        }
        
        function sendPoll() {
            const q = $("pollQ").value.trim();
            const optsStr = $("pollOpts").value.trim();
            if (!q || !optsStr) return;
            
            const opts = optsStr.split(",").map(s => s.trim()).filter(s => s);
            if (opts.length < 2) { alert("Need at least 2 options"); return; }
            
            if (window.AndroidBridge) {
                window.AndroidBridge.startPoll(q, JSON.stringify(opts));
                $("pollQ").value = "";
                $("pollOpts").value = "";
                togglePoll();
            }
        }
    </script>
</body>
</html>
